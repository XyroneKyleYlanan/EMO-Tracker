<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="770" viewBox="0 0 1150 770" font-family="Arial, Helvetica, sans-serif">
<title>EMO Tracker network topology</title>
<rect width="1150" height="770" fill="#ffffff"/>
<text x="575" y="40.0" text-anchor="middle" dominant-baseline="central" font-size="19" fill="#333333" font-weight="bold">Network Topology — EMO Tracker</text>
<line x1="745" y1="132" x2="880" y2="132" stroke="#555555" stroke-width="3"/>
<rect x="795.7" y="123" width="33.6" height="18" fill="#ffffff"/>
<text x="812.5" y="132.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#333333">USB</text>
<rect x="405" y="72" width="340" height="120" rx="10" fill="#555555" stroke="#444444" stroke-width="1.5"/>
<text x="575" y="100.5" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#ffffff" font-weight="bold">Server Laptop (the EMO's Windows laptop)</text>
<text x="575" y="121.5" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#ffffff">Laragon: PHP 8.3 and MySQL 8.4</text>
<text x="575" y="142.5" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#ffffff">Laravel API (127.0.0.1:8000) · React app (port 5173)</text>
<text x="575" y="163.5" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#ffffff">Uploaded documents (private storage)</text>
<rect x="880" y="97" width="220" height="70" rx="10" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="990" y="122.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#333333" font-weight="bold">USB Drive</text>
<text x="990" y="142.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#333333">Daily backups (BACKUP_PATH)</text>
<line x1="575" y1="192" x2="575" y2="292" stroke="#555555" stroke-width="2"/>
<rect x="551" y="233" width="48" height="18" fill="#ffffff"/>
<text x="575" y="242.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#333333">Wi-Fi</text>
<rect x="445" y="292" width="260" height="80" rx="10" fill="#ececec" stroke="#999999" stroke-width="1.5"/>
<text x="575" y="321.5" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#333333" font-weight="bold">Wi-Fi Router / Access Point</text>
<text x="575" y="342.5" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#333333">(university Wi-Fi or an office router)</text>
<line x1="485" y1="372" x2="145" y2="525" stroke="#555555" stroke-width="2"/>
<rect x="291" y="439.5" width="48" height="18" fill="#ffffff"/>
<text x="315" y="448.5" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#333333">Wi-Fi</text>
<rect x="35" y="525" width="220" height="76" rx="10" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="145" y="553.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#333333" font-weight="bold">Administrator</text>
<text x="145" y="573.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#333333">(Office Laptop)</text>
<line x1="545" y1="372" x2="431.6666666666667" y2="525" stroke="#555555" stroke-width="2"/>
<rect x="464.33333333333337" y="439.5" width="48" height="18" fill="#ffffff"/>
<text x="488.33333333333337" y="448.5" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#333333">Wi-Fi</text>
<rect x="321.6666666666667" y="525" width="220" height="76" rx="10" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="431.6666666666667" y="553.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#333333" font-weight="bold">Officer</text>
<text x="431.6666666666667" y="573.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#333333">(Laptop / Computer)</text>
<line x1="605" y1="372" x2="718.3333333333334" y2="525" stroke="#555555" stroke-width="2"/>
<rect x="637.6666666666667" y="439.5" width="48" height="18" fill="#ffffff"/>
<text x="661.6666666666667" y="448.5" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#333333">Wi-Fi</text>
<rect x="608.3333333333334" y="525" width="220" height="76" rx="10" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="718.3333333333334" y="553.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#333333" font-weight="bold">Staff</text>
<text x="718.3333333333334" y="573.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#333333">(Laptop / Tablet)</text>
<line x1="665" y1="372" x2="1005" y2="525" stroke="#555555" stroke-width="2"/>
<rect x="811" y="439.5" width="48" height="18" fill="#ffffff"/>
<text x="835" y="448.5" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#333333">Wi-Fi</text>
<rect x="895" y="525" width="220" height="76" rx="10" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="1005" y="553.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#333333" font-weight="bold">Staff</text>
<text x="1005" y="573.0" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#333333">(Mobile Phone)</text>
<rect x="228" y="655" width="694" height="88" rx="10" fill="#f7f7f7" stroke="#aaaaaa" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="250" y="679.0" text-anchor="start" dominant-baseline="central" font-size="12.5" fill="#444444">All devices connect to the same local area network (LAN). Users open EMO Tracker in a web browser at the server</text>
<text x="250" y="699.0" text-anchor="start" dominant-baseline="central" font-size="12.5" fill="#444444">laptop's address (for example, http://192.168.1.5:5173); nothing is installed on their devices. No internet or cloud</text>
<text x="250" y="719.0" text-anchor="start" dominant-baseline="central" font-size="12.5" fill="#444444">connection is required. Any role can use any device: the four devices shown are examples.</text>
</svg>
