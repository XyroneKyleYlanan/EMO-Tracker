<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="Arial, Helvetica, sans-serif">
<title>EMO Tracker network topology</title>
<rect width="1400" height="900" fill="#ffffff"/>
<text x="50" y="48" text-anchor="start" font-size="22" fill="#333333" font-weight="bold">EMO Tracker: Network Topology (star topology, local network only)</text>
<rect x="40" y="80" width="1320" height="690" rx="14" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="64" y="110" text-anchor="start" font-size="15" fill="#555555" font-weight="bold">EMO office local network (university Wi-Fi, or the office's own router)</text>
<line x1="350" y1="394" x2="614" y2="400" stroke="#555555" stroke-width="2" stroke-dasharray="9 7"/>
<line x1="786" y1="390" x2="1020" y2="230" stroke="#555555" stroke-width="2" stroke-dasharray="9 7"/>
<line x1="786" y1="404" x2="1020" y2="420" stroke="#555555" stroke-width="2" stroke-dasharray="9 7"/>
<line x1="780" y1="422" x2="1050" y2="580" stroke="#555555" stroke-width="2" stroke-dasharray="9 7"/>
<line x1="260" y1="452" x2="260" y2="582" stroke="#555555" stroke-width="3"/>
<g transform="translate(260,400) scale(1.15)">
  <rect x="-62" y="-50" width="124" height="80" rx="5" fill="#ececec" stroke="#888888" stroke-width="2"/>
  <rect x="-52" y="-41" width="104" height="62" fill="#ffffff" stroke="#bbbbbb"/>
  <path d="M-80,30 L80,30 L70,44 L-70,44 Z" fill="#ececec" stroke="#888888" stroke-width="2"/>
</g>
<text x="260" y="228" text-anchor="middle" font-size="15" fill="#333333" font-weight="bold">Server laptop (the EMO's Windows laptop)</text>
<text x="260" y="250" text-anchor="middle" font-size="14" fill="#444444">Laragon: Laravel API (127.0.0.1:8000), MySQL 8.4</text>
<text x="260" y="269" text-anchor="middle" font-size="14" fill="#444444">React app served on port 5173</text>
<text x="260" y="288" text-anchor="middle" font-size="14" fill="#444444">Uploaded documents in private storage</text>
<g transform="translate(260,600)">
  <rect x="-34" y="-18" width="58" height="36" rx="6" fill="#ececec" stroke="#888888" stroke-width="2"/>
  <rect x="24" y="-11" width="20" height="22" fill="#ffffff" stroke="#888888" stroke-width="2"/>
</g>
<text x="260" y="646" text-anchor="middle" font-size="14" fill="#444444">USB drive or second disk: daily backups (BACKUP_PATH)</text>
<g transform="translate(700,400)">
  <line x1="-40" y1="-22" x2="-52" y2="-62" stroke="#888888" stroke-width="4" stroke-linecap="round"/>
  <line x1="40" y1="-22" x2="52" y2="-62" stroke="#888888" stroke-width="4" stroke-linecap="round"/>
  <rect x="-80" y="-24" width="160" height="48" rx="8" fill="#ececec" stroke="#888888" stroke-width="2"/>
  <circle cx="-48" cy="0" r="4" fill="#2e7d4f"/><circle cx="-30" cy="0" r="4" fill="#2e7d4f"/><circle cx="-12" cy="0" r="4" fill="#2e7d4f"/>
  <path d="M-22,-82 Q0,-100 22,-82" fill="none" stroke="#888888" stroke-width="3" stroke-linecap="round"/>
  <path d="M-34,-92 Q0,-120 34,-92" fill="none" stroke="#888888" stroke-width="3" stroke-linecap="round"/>
</g>
<text x="700" y="452" text-anchor="middle" font-size="15" fill="#333333" font-weight="bold">Wi-Fi access point or router</text>
<text x="700" y="474" text-anchor="middle" font-size="14" fill="#444444">connects every device in a star</text>
<g transform="translate(1110,230) scale(0.85)">
  <rect x="-62" y="-50" width="124" height="80" rx="5" fill="#ececec" stroke="#888888" stroke-width="2"/>
  <rect x="-52" y="-41" width="104" height="62" fill="#ffffff" stroke="#bbbbbb"/>
  <path d="M-80,30 L80,30 L70,44 L-70,44 Z" fill="#ececec" stroke="#888888" stroke-width="2"/>
</g>
<text x="1110" y="294" text-anchor="middle" font-size="15" fill="#333333" font-weight="bold">Office laptops (any browser)</text>
<g transform="translate(1110,420) scale(0.85)">
  <rect x="-62" y="-50" width="124" height="80" rx="5" fill="#ececec" stroke="#888888" stroke-width="2"/>
  <rect x="-52" y="-41" width="104" height="62" fill="#ffffff" stroke="#bbbbbb"/>
  <path d="M-80,30 L80,30 L70,44 L-70,44 Z" fill="#ececec" stroke="#888888" stroke-width="2"/>
</g>
<text x="1110" y="484" text-anchor="middle" font-size="15" fill="#333333" font-weight="bold">More laptops, as needed</text>
<g transform="translate(1080,610)">
  <rect x="-24" y="-44" width="48" height="88" rx="8" fill="#ececec" stroke="#888888" stroke-width="2"/>
  <rect x="-18" y="-34" width="36" height="62" fill="#ffffff" stroke="#bbbbbb"/>
  <circle cx="0" cy="36" r="3.5" fill="#888888"/>
</g>
<g transform="translate(1180,610)">
  <rect x="-24" y="-44" width="48" height="88" rx="8" fill="#ececec" stroke="#888888" stroke-width="2"/>
  <rect x="-18" y="-34" width="36" height="62" fill="#ffffff" stroke="#bbbbbb"/>
  <circle cx="0" cy="36" r="3.5" fill="#888888"/>
</g>
<text x="1130" y="682" text-anchor="middle" font-size="15" fill="#333333" font-weight="bold">Phones (any browser)</text>
<text x="1130" y="140" text-anchor="middle" font-size="14" fill="#444444">Clients open http://SERVER-IP:5173</text>
<line x1="60" y1="805" x2="130" y2="805" stroke="#555555" stroke-width="2" stroke-dasharray="9 7"/>
<text x="142" y="810" text-anchor="start" font-size="14" fill="#333333">Wireless connection (Wi-Fi)</text>
<line x1="400" y1="805" x2="470" y2="805" stroke="#555555" stroke-width="3"/>
<text x="482" y="810" text-anchor="start" font-size="14" fill="#333333">Wired connection (USB)</text>
<rect x="700" y="793" width="60" height="24" rx="5" fill="#fafafa" stroke="#bbbbbb" stroke-dasharray="6 5"/>
<text x="772" y="810" text-anchor="start" font-size="14" fill="#333333">Local network boundary</text>
<text x="60" y="853" text-anchor="start" font-size="14" fill="#555555">No internet connection is needed. The system can only be reached from devices on the same network, and only the server laptop runs EMO Tracker.</text>
</svg>
