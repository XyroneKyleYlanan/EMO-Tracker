<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>EMO Tracker user journey maps</title>
<!--
  How to change a map: edit the text in MAPS below, save, and open this file in a browser.
  Each stage is: [name, actions, touchpoint, thought, feeling score from 1 (very negative) to 5 (very positive),
  feeling word, pain point, opportunity]. Leave a pain point or opportunity as '' when there is none.
  The PNGs in the folder above were taken from this page at 2x size.
-->
<style>
  body { margin: 0; background: #ffffff; font-family: Arial, Helvetica, sans-serif; color: #333333; }
  .map { width: 1600px; padding: 32px 36px 28px; box-sizing: border-box; background: #ffffff; }
  .map + .map { margin-top: 40px; }
  .title { font-size: 26px; font-weight: bold; color: #1f2937; }
  .kind { display: inline-block; margin-left: 12px; font-size: 14px; font-weight: bold; color: #0a5c3a; background: #e8f3ec; border: 1px solid #b9d9c5; padding: 3px 10px; vertical-align: 4px; }
  .facts { display: grid; grid-template-columns: 1fr 1fr 1fr 1.6fr; gap: 10px; margin: 14px 0 18px; }
  .fact { background: #f5f5f5; border: 1px solid #dddddd; padding: 9px 12px; font-size: 14px; line-height: 1.35; }
  .fact b { display: block; font-size: 12px; color: #6b6b6b; margin-bottom: 3px; }
  .grid { display: grid; border: 1px solid #cfcfcf; }
  .label { background: #f0f0f0; font-size: 13px; font-weight: bold; color: #444444; padding: 10px; border-bottom: 1px solid #dddddd; display: flex; align-items: center; }
  .stage { background: #0a5c3a; color: #ffffff; font-weight: bold; font-size: 14.5px; padding: 10px; border-left: 1px solid #2f7a57; }
  .stage span { display: inline-block; width: 22px; height: 22px; line-height: 22px; text-align: center; border-radius: 50%; background: #ffffff; color: #0a5c3a; font-size: 12px; margin-right: 6px; }
  .cell { font-size: 13.5px; line-height: 1.38; padding: 9px 10px; border-left: 1px solid #e3e3e3; border-bottom: 1px solid #dddddd; }
  .thought { font-style: italic; color: #444444; }
  .pain { background: #fbefef; }
  .opp { background: #edf6f0; }
  .none { color: #aaaaaa; }
  .feel { border-left: 1px solid #e3e3e3; border-bottom: 1px solid #dddddd; height: 190px; position: relative; }
  .feel svg { position: absolute; inset: 0; }
  .note { font-size: 12.5px; color: #666666; margin-top: 10px; }
</style>
</head>
<body>
<script>
const MAPS = [

   ],
   [

    3,
    "Alert",

    "Show the other booking's department in the warning"
   ],
   [
    "Handle changes",
    "Change a date and answer \"moved or correction?\"; cancel or restore events",
    "Event form, event panel",
    "The original date is kept, so nothing gets lost.",
    4,
    "Confident",
    "Task owners aren't told when an event moves",
    "Notify task owners of changes"
   ],
   [
    "Manage venues",
    "Add buildings and venues; merge duplicate spellings",
    "Venues page",
    "One spelling for each place.",
    4,
    "Organized",
    "",
    ""
   ],
   [

    "Create accounts, set roles, reset forgotten passwords, deactivate members who leave",

    "Only our office can get in.",
    3,

  ]
 },

  "title": "Officer",
  "kind": "To-Be: with EMO Tracker",
  "facts": [
   [
    "Who",
    "Prepares the events the EMO handles: tasks, documents, readiness and reports"
   ],
   [
    "Goal",
    "Get each event ready on time and keep its records"
   ],
   [
    "Scenario",
    "Preparing an upcoming event"
   ],
   [
    "Basis",
    "The system as built. Thoughts and feelings are the expected experience, to be confirmed with EMO users during the pilot."
   ]
  ],
  "lastLane": "Opportunities (possible future work)",
  "stages": [
   [
    "Log in",
    "Sign in on the office network",
    "Login page",
    "Time to prepare this week's events.",
    3,
    "Ready",
    "",
    ""
   ],
   [
    "Check Home",
    "Review Needs attention with its reasons, and the next 7 days",
    "Home page",
    "The reason tells me what to fix first.",
    4,
    "Aware",
    "Other people's changes show only after the page reloads",
    "Refresh the Home page automatically"
   ],
   [

    "Browse and search the year; open any event's details",

    ""
   ],
   [

  ]
 },
 {
  "id": "4-staff",
  "title": "Staff",
  "kind": "To-Be: with EMO Tracker",
  "facts": [
   [

   [

   ]
  ],
  "lastLane": "Opportunities (possible future work)",
  "stages": [
   [
    "Log in",

    "Login page",

    3,

   [

   ],

]

const esc = (t) => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
for (const m of MAPS) {
  const n = m.stages.length
  const col = (i) => i + 2
  let html = '<section class="map" id="' + m.id + '">'
  html += '<div><span class="title">User Journey Map: ' + esc(m.title) + '</span><span class="kind">' + esc(m.kind) + '</span></div>'
  html += '<div class="facts">' + m.facts.map(([k, v]) => '<div class="fact"><b>' + esc(k) + '</b>' + esc(v) + '</div>').join('') + '</div>'
  html += '<div class="grid" style="grid-template-columns: 128px repeat(' + n + ', 1fr)">'
  html += '<div class="label" style="background:#0a5c3a;color:#fff">Stage</div>'
  m.stages.forEach((s, i) => { html += '<div class="stage"><span>' + (i + 1) + '</span>' + esc(s[0]) + '</div>' })
  const lane = (label, idx, cls = '') => {
    html += '<div class="label">' + label + '</div>'
    m.stages.forEach((s) => { const t = s[idx]; html += '<div class="cell ' + cls + '">' + (t ? esc(t) : '<span class="none">—</span>') + '</div>' })
  }
  lane('Actions', 1)
  lane('Touchpoints', 2)
  lane('Thoughts', 3, 'thought')
  html += '<div class="label">Feelings</div><div class="feel" style="grid-column: 2 / span ' + n + '"><svg></svg></div>'
  lane('Pain points', 6, 'pain')
  lane(esc(m.lastLane), 7, 'opp')
  html += '</div>'
  if (m.id.startsWith('1-')) html += '<div class="note">* To be confirmed with the EMO. Feelings are inferred from the documented problems.</div>'
  else html += '<div class="note">Feelings show the expected experience on a scale from very negative (bottom) to very positive (top).</div>'
  html += '</section>'
  document.body.insertAdjacentHTML('beforeend', html)

  // The feelings curve: one point per stage, drawn once the lane has its real size.
  const box = document.getElementById(m.id).querySelector('.feel')
  const svg = box.querySelector('svg')
  const w = box.clientWidth, h = box.clientHeight, pad = 30
  svg.setAttribute('width', w); svg.setAttribute('height', h); svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h)
  const x = (i) => (i + 0.5) * (w / n)
  const y = (s) => pad + ((5 - s) / 4) * (h - 2 * pad)
  const color = (s) => (s >= 4 ? '#2e7d4f' : s === 3 ? '#b7791f' : '#c0392b')
  let out = ''
  for (let i = 1; i < n; i++) out += '<line x1="' + (i * w / n) + '" y1="0" x2="' + (i * w / n) + '" y2="' + h + '" stroke="#efefef"/>'
  out += '<line x1="0" y1="' + y(3) + '" x2="' + w + '" y2="' + y(3) + '" stroke="#cccccc" stroke-dasharray="5 5"/>'
  out += '<text x="8" y="' + (y(5) + 4) + '" font-size="12" fill="#2e7d4f">+ positive</text><text x="8" y="' + (y(1) + 4) + '" font-size="12" fill="#c0392b">– negative</text>'
  const pts = m.stages.map((s, i) => [x(i), y(s[4])])
  let d = 'M' + pts[0][0] + ',' + pts[0][1]
  for (let i = 1; i < pts.length; i++) {
    const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], mx = (x0 + x1) / 2
    d += ' C' + mx + ',' + y0 + ' ' + mx + ',' + y1 + ' ' + x1 + ',' + y1
  }
  out += '<path d="' + d + '" fill="none" stroke="#555555" stroke-width="2.5"/>'
  m.stages.forEach((s, i) => {
    const [px, py] = pts[i]
    out += '<circle cx="' + px + '" cy="' + py + '" r="8" fill="' + color(s[4]) + '" stroke="#ffffff" stroke-width="2"/>'
    const below = s[4] > 1
    out += '<text x="' + px + '" y="' + (below ? py + 26 : py - 16) + '" text-anchor="middle" font-size="13" font-weight="bold" fill="' + color(s[4]) + '">' + esc(s[5]) + '</text>'
  })
  svg.innerHTML = out
}
</script>
</body>
</html>
